<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>用户登录评分告警报表</title>
  <link rel="stylesheet" id="prototypeStyles">
  <script>document.getElementById('prototypeStyles').href = `styles.css?t=${Date.now()}`;</script>
</head>
<body data-readonly-alerts data-alert-monitor>
  <main>
    <section class="view account-score-view active">
      <div class="admin-system-shell">
        <aside class="admin-menu" aria-label="管理后台菜单">
          <div class="admin-menu-title">管理后台</div>
          <ul class="admin-menu-groups">
            <li class="expanded">－ 用户管理
              <ul><li class="active">用户登录评分告警报表<span class="menu-count-badge" id="accountAlertBadge" hidden>0</span></li></ul>
            </li>
          </ul>
        </aside>
        <div class="admin-workspace">
          <div class="admin-breadcrumb"><strong>后台管理</strong> - 用户管理 - <span>用户登录评分告警报表</span></div>
          <nav class="admin-page-tabs" aria-label="登录告警后台">
            <button class="admin-page-tab active" data-admin-tab="alerts">登录评分告警<span class="tab-count-badge" id="loginAlertTabBadge" hidden>0</span></button>
            <button class="admin-page-tab" data-admin-tab="records">登录评分总表</button>
            <button class="admin-page-tab" data-admin-tab="rules">评分规则与范围</button>
          </nav>

          <div class="admin-tab-panel active" id="alertsPanel">
            <div class="account-page-head"><div><h1>登录评分告警</h1><p>展示低于告警阈值的登录记录</p></div></div>
            <div class="filter-bar login-alert-filter">
              <label><select id="loginAlertSearchType" aria-label="告警查询字段"><option value="memberId">会员ID</option><option value="user">会员账号</option><option value="ip">登录IP</option><option value="device">登录设备</option></select><input id="loginAlertKeyword" placeholder="输入会员ID"></label>
              <label><span>分数档位</span><select id="loginAlertScoreTier"><option value="all">全部告警分数</option><option value="40-59">40至59分</option><option value="20-39">20至39分</option><option value="0-19">0至19分</option></select></label>
              <label><span>账号状态</span><select id="loginAlertAccountStatus"><option value="all">全部</option><option value="正常">正常</option><option value="冻结">冻结</option></select></label>
              <button class="admin-btn secondary" id="loginAlertSearchBtn">查询</button><button class="link-btn" id="loginAlertResetBtn">重置</button>
            </div>
            <div class="table-wrap"><table class="admin-table login-alert-table"><thead><tr><th>会员ID</th><th>会员账号</th><th>登录时间</th><th>登录IP</th><th>登录设备</th><th>本次评分</th><th>扣分判断条件</th><th>账号状态</th><th>查看</th></tr></thead><tbody id="loginAlertTableBody"></tbody></table></div>
            <div class="table-footer"><span>共 <strong id="loginAlertTotal">0</strong> 条告警记录</span></div>
          </div>

          <div class="admin-tab-panel" id="recordsPanel">
            <div class="account-page-head scoring-settings-head">
              <div><h1>登录评分总表</h1><p>每次登录独立评分，按登录记录查看</p></div>
              <div class="risk-quick-group">
                <button class="risk-count-quick" id="riskIpListBtn">风险IP共<strong id="riskIpListCount">0</strong>条</button>
                <button class="risk-count-quick" id="riskDeviceListBtn">风险设备共<strong id="riskDeviceListCount">0</strong>条</button>
              </div>
            </div>
            <div class="filter-bar login-alert-filter">
              <label><select id="scoreRecordSearchType" aria-label="评分记录查询字段"><option value="memberId">会员ID</option><option value="user">会员账号</option><option value="ip">登录IP</option><option value="device">登录设备</option></select><input id="scoreRecordKeyword" placeholder="输入会员ID"></label>
              <label><span>评分结果</span><select id="scoreRecordTier"><option value="all">全部</option><option value="80-100">80至100分</option><option value="60-79">60至79分</option><option value="40-59">40至59分</option><option value="20-39">20至39分</option><option value="0-19">0至19分</option></select></label>
              <label><span>账号状态</span><select id="scoreRecordAccountStatus"><option value="all">全部</option><option value="正常">正常</option><option value="冻结">冻结</option></select></label>
              <div class="login-time-range" role="group" aria-label="登录时间范围"><span>登录时间</span><input type="datetime-local" step="1" id="scoreRecordLoginStart" aria-label="登录开始时间"><span>至</span><input type="datetime-local" step="1" id="scoreRecordLoginEnd" aria-label="登录结束时间"></div>
              <button class="admin-btn secondary" id="scoreRecordSearchBtn">查询</button><button class="link-btn" id="scoreRecordResetBtn">重置</button>
            </div>
            <div class="table-wrap"><table class="admin-table login-alert-table"><thead><tr><th>会员ID</th><th>会员账号</th><th>登录时间</th><th>登录IP</th><th>登录设备</th><th>本次评分</th><th>扣分判断条件</th><th>账号状态</th><th>查看</th></tr></thead><tbody id="scoreRecordTableBody"></tbody></table></div>
            <div class="table-footer"><span>共 <strong id="scoreRecordTotal">0</strong> 条评分记录</span></div>
          </div>

          <div class="admin-tab-panel" id="rulesPanel">
            <div class="account-page-head scoring-settings-head">
              <div><h1>评分规则与范围</h1><p>登录评分范围：<strong id="loginScoreScopeSummary">指定代理线（未配置，不评分）</strong></p></div>
              <button class="admin-btn" id="loginScoreScopeBtn">配置登录评分范围</button>
            </div>
            <div class="table-wrap"><table class="admin-table"><thead><tr><th>ID</th><th>判断条件</th><th>扣分</th><th>累计方式</th><th>说明</th></tr></thead><tbody id="ruleTableBody"></tbody></table></div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div class="dialog-mask hidden" id="dialogMask"><div class="admin-dialog" id="adminDialog"></div></div>
  <script>
    const runtimeScript = document.createElement('script');
    runtimeScript.src = `app.js?t=${Date.now()}`;
    document.body.appendChild(runtimeScript);
  </script>
</body>
</html>
