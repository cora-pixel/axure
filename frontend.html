<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>前台登录环境验证原型</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand-block">
      <div class="brand-mark">杏</div>
      <div><strong>登录环境风险评分</strong><span>前台交互原型</span></div>
    </div>
    <div class="standalone-title">前台登录与安全验证</div>
    <a class="prototype-jump" href="backend.html">查看后台原型</a>
  </header>

  <main>
    <section id="frontendView" class="view active">
      <div class="frontend-layout">
        <section class="prototype-stage">
          <div class="site-nav"><strong>杏彩体育</strong><span>首页　体育　真人　优惠</span></div>
          <div class="site-content" id="siteContent">
            <div class="login-card" id="loginCard">
              <h2>欢迎登录</h2>
              <label>用户名<input id="username" value="yongson005@as"></label>
              <label>密码<input id="password" type="password" value="123456"></label>
              <button class="primary wide" id="loginBtn">登录</button>
            </div>
            <div class="home-content hidden" id="homeContent">
              <div class="home-heading">欢迎回来</div>
              <div class="home-metrics">
                <div><span>账户余额</span><strong>¥ 28,560.00</strong></div>
                <div><span>可用优惠</span><strong>6 项</strong></div>
                <div><span>站内消息</span><strong>3 条</strong></div>
              </div>
            </div>
          </div>
          <div class="toast hidden" id="toast"></div>
          <div class="modal-mask hidden" id="modalMask"><div class="security-modal" id="securityModal" role="dialog" aria-modal="true"></div></div>
        </section>

        <aside class="simulator-panel">
          <div class="panel-title">
            <div><h2>场景模拟</h2><p>选择分数后点击登录</p></div>
            <div class="score-orb" id="scoreOrb">55</div>
          </div>
          <div class="segmented" id="scenarioButtons">
            <button data-score="90">90 放行</button><button data-score="70">70 观察</button><button class="active" data-score="55">55 单验</button><button data-score="35">35 双验</button><button data-score="15">15 人工</button>
          </div>
          <div class="control-summary"><span>当前控制</span><strong id="controlAction">单项验证</strong></div>
          <h3>可用验证资料</h3>
          <label class="toggle-row"><span>手机号码</span><input type="checkbox" data-method-toggle="phone" checked></label>
          <label class="toggle-row"><span>邮箱</span><input type="checkbox" data-method-toggle="email" checked></label>
          <label class="toggle-row"><span>上次成功提款账号</span><input type="checkbox" data-method-toggle="withdraw" checked></label>
          <label class="toggle-row"><span>资金密码</span><input type="checkbox" data-method-toggle="fund"></label>
          <div class="demo-values"><h3>演示校验值</h3><p>验证码：<code>863921</code></p><p>提款账号：<code>6222533452567006509</code></p><p>资金密码：<code>123456</code></p></div>
          <div class="state-log"><span>本次状态</span><strong id="frontState">等待登录</strong><small id="frontStateDetail">风险分数将在登录时生效</small></div>
        </aside>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
