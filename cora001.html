<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>前台登录环境验证原型</title>
  <link rel="preload" href="assets/cora001-home.png?v=20261117-3" as="image">
  <link rel="stylesheet" href="styles.css?v=20261117-6">
</head>
<body class="frontend-body">
  <main class="frontend-main">
    <section id="frontendView" class="view active">
      <div class="frontend-stack">
        <section class="prototype-stage">
          <div class="prototype-canvas" id="siteContent">
            <img id="prototypeBackground" src="assets/cora001-login.png" alt="杏彩体育登录页面">
            <button class="screen-hotspot login-submit-hotspot" id="loginBtn" aria-label="登录" title="登录"></button>
            <button class="screen-hotspot login-close-hotspot" id="loginCloseBtn" aria-label="关闭登录弹框" title="关闭登录弹框"></button>
          </div>
          <div class="toast hidden" id="toast"></div>
          <div class="modal-mask hidden" id="modalMask"><div class="security-modal" id="securityModal" role="dialog" aria-modal="true"></div></div>
        </section>

        <aside class="simulator-panel horizontal-simulator">
          <div class="simulator-block panel-title">
            <div><h2>场景模拟</h2><p>选择分数后点击登录</p></div>
            <div class="score-orb" id="scoreOrb">55</div>
          </div>
          <div class="simulator-block scenario-block">
            <div class="segmented" id="scenarioButtons">
              <button data-score="90">90 放行</button><button data-score="70">70 观察</button><button class="active" data-score="55">55 单验</button><button data-score="35">35 双验</button><button data-score="15">15 人工</button>
            </div>
            <div class="control-summary"><span>当前控制</span><strong id="controlAction">单项验证</strong></div>
          </div>
          <div class="simulator-block method-block">
            <h3>可用验证资料</h3>
            <div class="toggle-grid">
              <label class="toggle-row"><span>手机号码</span><input type="checkbox" data-method-toggle="phone" checked></label>
              <label class="toggle-row"><span>邮箱</span><input type="checkbox" data-method-toggle="email" checked></label>
              <label class="toggle-row"><span>上次成功提款账号</span><input type="checkbox" data-method-toggle="withdraw" checked></label>
              <label class="toggle-row"><span>资金密码</span><input type="checkbox" data-method-toggle="fund"></label>
            </div>
          </div>
          <div class="simulator-block demo-values"><h3>演示校验值</h3><p>验证码：<code>863921</code></p><p>提款账号：<code>6222533452567006509</code></p><p>资金密码：<code>123456</code></p></div>
          <div class="simulator-block state-log"><span>本次状态</span><strong id="frontState">等待登录</strong><small id="frontStateDetail">风险分数将在登录时生效</small></div>
        </aside>
      </div>
    </section>
  </main>
  <script src="app.js?v=20261117-6"></script>
</body>
</html>
